<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Forsaken</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #050b18;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(29, 78, 216, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(185, 28, 28, 0.3) 0%, transparent 40%),
                linear-gradient(to bottom, #030712, #0b0f19);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            margin-bottom: 25px;
        }

        .script-group {
            margin-bottom: 20px;
            text-align: left; /* Canh chữ tiêu đề lệch trái một chút so với ô input cho đẹp */
        }

        .script-label {
            color: #93c5fd;
            font-size: 13px;
            margin-bottom: 5px;
            margin-left: 5px;
            font-weight: bold;
            display: block;
        }

        .input-box {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 8px;
            padding: 6px 8px;
            box-shadow: 0 0 15px rgba(29, 78, 216, 0.2);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            padding: 8px;
            outline: none;
        }

        .input-box button {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>script forsaken</h1>
        
        <div class="script-group">
            <span class="script-label">Chance Aimbot</span>
            <div class="input-box">
                <input type="text" id="s1" value="loadstring(game:HttpGet('https://example.com/script1.lua'))()" readonly>
                <button onclick="copyScript('s1')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Veeronica Auto Trick</span>
            <div class="input-box">
                <input type="text" id="s2" value="loadstring(game:HttpGet('https://example.com/script2.lua'))()" readonly>
                <button onclick="copyScript('s2')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Veeronica Skate Controller (no UI)</span>
            <div class="input-box">
                <input type="text" id="s3" value="loadstring(game:HttpGet('https://example.com/script3.lua'))()" readonly>
                <button onclick="copyScript('s3')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Auto Slash (Slasher Only)</span>
            <div class="input-box">
                <input type="text" id="s4" value="loadstring(game:HttpGet('https://example.com/script4.lua'))()" readonly>
                <button onclick="copyScript('s4')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Stamina Settings</span>
            <div class="input-box">
                <input type="text" id="s4" value="coming soon...'))()" readonly>
                <button onclick="copyScript('s4')">Copy</button>
            </div>
        </div>
    </div>

    <script>
        function copyScript(id) {
            var el = document.getElementById(id);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(el.value).then(() => alert("Đã copy script!"));
            } else {
                el.removeAttribute('readonly');
                el.select();
                document.execCommand('copy');
                el.setAttribute('readonly', 'true');
                alert("Đã copy script!");
            }
        }
    </script>
</body>
</html>
