<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Forsaken</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #050b18;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(29, 78, 216, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(185, 28, 28, 0.3) 0%, transparent 40%),
                linear-gradient(to bottom, #030712, #0b0f19);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            margin-bottom: 25px;
        }

        h2 {
            color: #60a5fa;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 35px;
            margin-bottom: 20px;
            text-align: left;
            border-left: 4px solid #3b82f6;
            padding-left: 10px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .script-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .script-label {
            color: #93c5fd;
            font-size: 13px;
            margin-bottom: 5px;
            margin-left: 5px;
            font-weight: bold;
            display: block;
        }

        .input-box {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 8px;
            padding: 6px 8px;
            box-shadow: 0 0 15px rgba(29, 78, 216, 0.2);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            padding: 8px;
            outline: none;
        }

        .input-box button {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MỤC 1: SCRIPT FORSAKEN -->
        <h1>script forsaken</h1>
        
        <div class="script-group">
            <span class="script-label">Chance Aimbot</span>
            <div class="input-box">
                <input type="text" id="s1" value='loadstring(game:HttpGet("https://raw.githubusercontent.com/meogaming2025/Script/refs/heads/main/Forsaken/Chance%20Aimbot.lua"))()' readonly>
                <button onclick="copyScript('s1')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Veeronica Auto Trick</span>
            <div class="input-box">
                <input type="text" id="s2" value='loadstring(game:HttpGet("https://raw.githubusercontent.com/meogaming2025/Script/refs/heads/main/Forsaken/veeronica%20auto%20trick.lua"))()' readonly>
                <button onclick="copyScript('s2')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Veeronica Skate Controller (no UI)</span>
            <div class="input-box">
                <input type="text" id="s3" value='loadstring(game:HttpGet("https://raw.githubusercontent.com/meogaming2025/Script/refs/heads/main/Forsaken/Veeronica%20skate%20controller.lua"))()' readonly>
                <button onclick="copyScript('s3')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Jane Doe aimbot (outdate and bugs)</span>
            <div class="input-box">
                <input type="text" id="s1" value='loadstring(game:HttpGet("https://raw.githubusercontent.com/meogaming2025/Script/refs/heads/main/Forsaken/Jane%20Doe%20aimbot.lua"))()' readonly>
                <button onclick="copyScript('s4')">Copy</button>
            </div>
        </div>
        
        <div class="script-group">
            <span class="script-label">Auto Slash (Slasher Only)</span>
            <div class="input-box">
                <input type="text" id="s4" value='loadstring(game:HttpGet("https://raw.githubusercontent.com/meogaming2025/Script/refs/heads/main/Forsaken/Slasher%20auto%20slash.lua"))()' readonly>
                <button onclick="copyScript('s5')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Stamina Settings</span>
            <div class="input-box">
                <input type="text" id="s5" value="coming soon..." readonly>
                <button onclick="copyScript('s5')">Copy</button>
            </div>
        </div>

        <!-- MỤC 2: USEFUL SCRIPT -->
        <h2>Useful Script</h2>

        <div class="script-group">
            <span class="script-label">Script Tiện Ích 1</span>
            <div class="input-box">
                <input type="text" id="u1" value='loadstring(game:HttpGet("USEFUL_LINK_1"))()' readonly>
                <button onclick="copyScript('u1')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Script Tiện Ích 2</span>
            <div class="input-box">
                <input type="text" id="u2" value='loadstring(game:HttpGet("USEFUL_LINK_2"))()' readonly>
                <button onclick="copyScript('u2')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Script Tiện Ích 3</span>
            <div class="input-box">
                <input type="text" id="u3" value='loadstring(game:HttpGet("USEFUL_LINK_3"))()' readonly>
                <button onclick="copyScript('u3')">Copy</button>
            </div>
        </div>

        <div class="script-group">
            <span class="script-label">Script Tiện Ích 4</span>
            <div class="input-box">
                <input type="text" id="u4" value='loadstring(game:HttpGet("USEFUL_LINK_4"))()' readonly>
                <button onclick="copyScript('u4')">Copy</button>
            </div>
        </div>
    </div>

    <script>
        function copyScript(id) {
            var el = document.getElementById(id);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(el.value).then(() => alert("Đã copy script!"));
            } else {
                el.removeAttribute('readonly');
                el.select();
                document.execCommand('copy');
                el.setAttribute('readonly', 'true');
                alert("Đã copy script!");
            }
        }
    </script>
</body>
</html>
