<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Forsaken</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #050b18;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(29, 78, 216, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(185, 28, 28, 0.3) 0%, transparent 40%),
                linear-gradient(to bottom, #030712, #0b0f19);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 0 20px rgba(29, 78, 216, 0.3);
            margin-bottom: 15px;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #93c5fd;
            font-size: 14px;
            padding: 10px;
            outline: none;
            text-overflow: ellipsis;
        }

        .input-box button {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-box button:hover {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>script forsaken</h1>
        
        <!-- Ô số 1 -->
        <div class="input-box">
            <input type="text" id="scriptText1" value="loadstring(game:HttpGet('https://example.com/script1.lua'))()" readonly>
            <button onclick="copyScript('scriptText1')">Copy</button>
        </div>

        <!-- Ô số 2 -->
        <div class="input-box">
            <input type="text" id="scriptText2" value="loadstring(game:HttpGet('https://example.com/script2.lua'))()" readonly>
            <button onclick="copyScript('scriptText2')">Copy</button>
        </div>

        <!-- Ô số 3 -->
        <div class="input-box">
            <input type="text" id="scriptText3" value="loadstring(game:HttpGet('https://example.com/script3.lua'))()" readonly>
            <button onclick="copyScript('scriptText3')">Copy</button>
        </div>

        <!-- Ô số 4 -->
        <div class="input-box">
            <input type="text" id="scriptText4" value="loadstring(game:HttpGet('https://example.com/script4.lua'))()" readonly>
            <button onclick="copyScript('scriptText4')">Copy</button>
        </div>
    </div>

    <script>
        function copyScript(id) {
            var copyText = document.getElementById(id);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(copyText.value).then(function() {
                    alert("Đã copy script thành công!");
                }).catch(function() {
                    forceCopy(copyText);
                });
            } else {
                forceCopy(copyText);
            }
        }

        function forceCopy(el) {
            el.removeAttribute('readonly');
            el.select();
            el.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                alert("Đã copy script thành công!");
            } catch (err) {
                alert("Hãy nhấn giữ vào ô chữ để copy thủ công nhé!");
            }
            el.setAttribute('readonly', 'true');
        }
    </script>
</body>
</html>
